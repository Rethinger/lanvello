name: build & release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: "386"}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm, goarm: "7"}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: windows, goarch: "386"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          V="${{ steps.ver.outputs.v }}"
          ARCH="$GOARCH"
          [ -n "$GOARM" ] && ARCH="armv${GOARM}"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          PKG="lanvello_${V}_${GOOS}_${ARCH}"
          mkdir -p "stage/$PKG"
          go build -trimpath -ldflags "-s -w -X main.version=$V" \
            -o "stage/$PKG/lanvello$EXT" ./cmd/lanvello
          cp README.md "stage/$PKG/"
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -qr "../${PKG}.zip" "$PKG")
          else
            tar -C stage -czf "${PKG}.tar.gz" "$PKG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              -R "$GITHUB_REPOSITORY" \
              --generate-notes --title "lanvello $GITHUB_REF_NAME"
          fi
